name: ci
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/SolarLedger.Api/SolarLedger.Api.csproj
      - name: Build
        run: dotnet build src/SolarLedger.Api/SolarLedger.Api.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/SolarLedger.UnitTests/SolarLedger.UnitTests.csproj --configuration Release
